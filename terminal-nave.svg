<svg width="720" height="300" viewBox="0 0 720 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stefanus Evan terminal profile">
  <defs>
    <!-- Clip path so the header bar matches the rounded window corners -->
    <clipPath id="window-clip">
      <rect x="1" y="1" width="718" height="298" rx="12" />
    </clipPath>

    <!-- Subtle Catppuccin Mocha gradients -->
    <linearGradient id="window-grad" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#1b1b29" />
    </linearGradient>

    <linearGradient id="header-accent" x1="1" y1="0" x2="719" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="35%" stop-color="#cba6f7" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#89b4fa" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#313244" />
    </linearGradient>

    <linearGradient id="json-accent" x1="0" y1="146" x2="0" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
  </defs>

  <style>
    /* ==========================================
       Catppuccin Mocha Palette
       ========================================== */
    .window-bg {
      fill: url(#window-grad);
      stroke: #313244; /* Surface0 */
      stroke-width: 1.5;
    }
    .header-bg {
      fill: #181825; /* Mantle */
    }
    .header-border {
      stroke: url(#header-accent);
      stroke-width: 1.25;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      fill: #a6adc8; /* Subtext0 */
    }
    .badge-bg {
      fill: #313244; /* Surface0 */
    }
    .badge-text {
      font-family: "Fira Code", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #cba6f7; /* Mauve */
    }

    /* Terminal Typography */
    .term-text {
      font-family: "Fira Code", "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      font-size: 13.5px;
    }
    .prompt-user {
      fill: #a6e3a1; /* Green */
      font-weight: 700;
    }
    .prompt-path {
      fill: #89b4fa; /* Blue */
      font-weight: 700;
    }
    .prompt-sym {
      fill: #cba6f7; /* Mauve */
      font-weight: 700;
    }
    .text-main {
      fill: #cdd6f4; /* Text */
    }
    .text-bold {
      fill: #cdd6f4; /* Text */
      font-weight: 600;
    }
    .text-sub {
      fill: #bac2de; /* Subtext1 */
    }
    .text-muted {
      fill: #6c7086; /* Overlay0 */
    }
    .text-accent {
      fill: #94e2d5; /* Teal */
      font-weight: 500;
    }

    /* JSON Card and Syntax Highlighting */
    .json-card {
      fill: #181825; /* Mantle */
      stroke: #313244; /* Surface0 */
      stroke-width: 1;
    }
    .json-punct {
      fill: #9399b2; /* Overlay2 */
    }
    .json-key {
      fill: #cba6f7; /* Mauve */
    }
    .json-str {
      fill: #f9e2af; /* Yellow */
    }

    /* ==========================================
       Typing and Reveal Animations
       ========================================== */
    .type-cmd-1 {
      clip-path: inset(0 100% 0 0);
      animation: typing 0.6s steps(6, end) 0.4s forwards;
    }
    .show-out-1 {
      opacity: 0;
      animation: fadeIn 0.25s ease-out 1.1s forwards;
    }
    .show-prompt-2 {
      opacity: 0;
      animation: fadeIn 0.15s ease-out 1.4s forwards;
    }
    .type-cmd-2 {
      clip-path: inset(0 100% 0 0);
      animation: typing 1.1s steps(16, end) 1.6s forwards;
    }
    .show-out-2 {
      opacity: 0;
      animation: fadeIn 0.3s ease-out 2.85s forwards;
    }
    .show-prompt-3 {
      opacity: 0;
      animation: fadeIn 0.15s ease-out 3.25s forwards;
    }

    /* Cursor (Catppuccin Rosewater) */
    .cursor {
      fill: #f5e0dc;
      animation: blink 1s step-end infinite;
    }

    @keyframes typing {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .type-cmd-1, .type-cmd-2 {
        clip-path: inset(0 0 0 0);
        animation: none;
      }
      .show-out-1, .show-prompt-2, .show-out-2, .show-prompt-3 {
        opacity: 1;
        animation: none;
      }
      .cursor {
        animation: none;
      }
    }
  </style>

  <!-- Window Frame -->
  <rect x="1" y="1" width="718" height="298" rx="12" class="window-bg" />

  <!-- Header Bar -->
  <g clip-path="url(#window-clip)">
    <rect x="1" y="1" width="718" height="37" class="header-bg" />
    <line x1="1" y1="38" x2="719" y2="38" class="header-border" />
  </g>

  <!-- Window Controls (Red, Yellow, Green) -->
  <g>
    <circle cx="22" cy="19.5" r="5.5" fill="#f38ba8" />
    <circle cx="41" cy="19.5" r="5.5" fill="#f9e2af" />
    <circle cx="60" cy="19.5" r="5.5" fill="#a6e3a1" />
  </g>

  <!-- Header Title & Shell Badge -->
  <text x="360" y="23.5" text-anchor="middle" class="title-text">evan@homelab: ~</text>
  <g>
    <rect x="652" y="10" width="46" height="19" rx="5" class="badge-bg" />
    <text x="675" y="23" text-anchor="middle" class="badge-text">bash</text>
  </g>

  <!-- Command 1: whoami -->
  <g>
    <text x="22" y="66" class="term-text">
      <tspan class="prompt-user">evan@ub</tspan><tspan class="text-muted">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan>
    </text>
    <text x="112" y="66" class="term-text text-main type-cmd-1">whoami</text>
  </g>

  <!-- Output 1 -->
  <text x="22" y="90" class="term-text show-out-1">
    <tspan class="text-bold">Stefanus Evan</tspan><tspan class="text-muted"> — </tspan><tspan class="text-sub">Computer Engineering</tspan><tspan class="prompt-sym"> @ </tspan><tspan class="text-accent">Universitas Brawijaya</tspan>
  </text>

  <!-- Command 2: cat profile.json -->
  <g class="show-prompt-2">
    <text x="22" y="124" class="term-text">
      <tspan class="prompt-user">evan@ub</tspan><tspan class="text-muted">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan>
    </text>
    <text x="112" y="124" class="term-text text-main type-cmd-2">cat profile.json</text>
  </g>

  <!-- Output 2: profile.json Card -->
  <g class="show-out-2">
    <rect x="22" y="138" width="676" height="114" rx="8" class="json-card" />
    <rect x="22" y="146" width="3" height="98" rx="1.5" fill="url(#json-accent)" />

    <text x="38" y="158" class="term-text json-punct">{</text>
    <text x="54" y="179" class="term-text">
      <tspan class="json-key">"focus"</tspan><tspan class="json-punct">: [</tspan><tspan class="json-str">"Networking"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"IoT &amp; Embedded"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"Edge AI &amp; Distributed Computing"</tspan><tspan class="json-punct">],</tspan>
    </text>
    <text x="54" y="200" class="term-text">
      <tspan class="json-key">"stack"</tspan><tspan class="json-punct">: [</tspan><tspan class="json-str">"C++"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"C"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"Python"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"JS/React"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"MySQL"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"MongoDB"</tspan><tspan class="json-punct">],</tspan>
    </text>
    <text x="54" y="221" class="term-text">
      <tspan class="json-key">"homelab"</tspan><tspan class="json-punct">: [</tspan><tspan class="json-str">"Ubuntu Server"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"MikroTik"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"Tailscale"</tspan><tspan class="json-punct">, </tspan><tspan class="json-str">"CasaOS"</tspan><tspan class="json-punct">]</tspan>
    </text>
    <text x="38" y="242" class="term-text json-punct">}</text>
  </g>

  <!-- Active Prompt & Blinking Cursor -->
  <g class="show-prompt-3">
    <text x="22" y="278" class="term-text">
      <tspan class="prompt-user">evan@ub</tspan><tspan class="text-muted">:</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-sym">$ </tspan>
    </text>
    <rect x="112" y="265" width="8" height="16" rx="1.5" class="cursor" />
  </g>
</svg>
